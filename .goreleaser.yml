version: 2
project_name: llamavm

before:
  hooks:
    - go mod tidy

builds:
  - id: llamavm
    main: ./cmd/llamavm
    binary: llamavm
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [arm64]
    ldflags:
      - -s -w -X main.llamavmVersion={{.Version}}
  - id: llamavm-shim
    main: ./cmd/llamavm-shim
    binary: llamavm-shim
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [arm64]
    ldflags:
      - -s -w

archives:
  - id: default
    ids:
      - llamavm
      - llamavm-shim
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    files:
      - LICENSE*
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

homebrew_casks:
  - name: llamavm
    binaries:
      - llamavm
      - llamavm-shim
    repository:
      owner: gregmundy
      name: homebrew-tap
      # Fine-grained PAT (Contents: write on homebrew-tap). The workflow's
      # default GITHUB_TOKEN is scoped to the llamavm repo and would 403
      # ("Resource not accessible by integration") when pushing to a
      # different repo.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/gregmundy/llamavm"
    description: "Version manager for llama.cpp on Apple Silicon"
    license: "MIT"
    # Casks are quarantined on download by default; our binaries are
    # cross-compiled, unsigned, and unnotarized, so without this hook
    # macOS Gatekeeper would refuse to launch them. Strip the
    # com.apple.quarantine xattr at install time.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", staged_path]
          end
    caveats: |
      llamavm needs its shims directory on PATH. Add this to your shell rc:

        export PATH="$HOME/.llamavm/shims:$PATH"

      Then install a llama.cpp version:

        llamavm install latest
        llamavm doctor
