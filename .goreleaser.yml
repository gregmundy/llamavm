version: 2
project_name: llamavm

before:
  hooks:
    - go mod tidy

builds:
  - id: llamavm
    main: ./cmd/llamavm
    binary: llamavm
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [arm64]
    ldflags:
      - -s -w -X main.llamavmVersion={{.Version}}
  - id: llamavm-shim
    main: ./cmd/llamavm-shim
    binary: llamavm-shim
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [arm64]
    ldflags:
      - -s -w

archives:
  - id: default
    ids:
      - llamavm
      - llamavm-shim
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    files:
      - LICENSE*
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

brews:
  - name: llamavm
    repository:
      owner: gregmundy
      name: homebrew-tap
    directory: Formula
    homepage: "https://github.com/gregmundy/llamavm"
    description: "Version manager for llama.cpp on Apple Silicon"
    license: "MIT"
    skip_upload: false
    install: |
      bin.install "llamavm"
      bin.install "llamavm-shim"
    caveats: |
      llamavm needs its shims directory on PATH. Add this to your shell rc:

        export PATH="$HOME/.llamavm/shims:$PATH"

      Then install a llama.cpp version:

        llamavm install latest
        llamavm doctor
    test: |
      assert_match "llamavm version", shell_output("#{bin}/llamavm --version")
